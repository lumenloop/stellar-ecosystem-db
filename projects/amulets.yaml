description: |-
  Amulets is a live stablecoin banking app for LatAm users.  

  We give crypto users a simple dollar account to hold stablecoins, swap assets, spend globally with a Visa card, and earn crypto rewards.  

  The product is already live, has real users and is generating revenue.  

  Our goal is to become the primary dollar account for crypto-native users in LatAm.
