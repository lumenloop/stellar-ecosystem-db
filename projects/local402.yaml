description: x402 payments on Stellar priced in local currencies. Sellers price API routes in any of the fiat currencies the Reflector oracle publishes (MXN, BRL, EUR, INR, NGN, KES, JPY, CLP and more) and receive the exact USDC amount, while payers settle in USDC, XLM or EURC through the FxPay Soroban contract.
