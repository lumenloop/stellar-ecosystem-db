description: Sorted is a non-custodial mobile wallet for Android and Android Go phones, built for users in Africa and South Asia. It enables Stellar USDC send and receive, Polygon-to-Stellar USDC bridging, and local cash withdrawals via MoneyGram Ramps (SEP-10/SEP-24) — designed for low-spec devices, intermittent connectivity, and users without access to traditional banking.
