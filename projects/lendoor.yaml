description: Embedded uncollateralized credit protocol built on Stellar/Soroban, targeting the 186M+ credit-invisible adults in Latin America. Users access USDC microloans without collateral; on-time repayment builds a portable on-chain credit score and grows their credit limit. Designed to plug into wallets and exchanges (e.g., Bitso) as an embedded credit layer.
