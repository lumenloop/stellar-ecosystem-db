description: Slimepay is a regulated fiat-to-Stellar anchor and merchant settlement rail for Africa. It bridges customer accounts to the Stellar network via SEP-6, SEP-24, and SEP-31, enabling USDC-to-NGN cross-border B2B payments with full KYC, interactive deposits, and programmatic withdrawals.
