description: Kutana is a B2B cross-border trade platform for African SMEs. Its Trade Secure product provides milestone-based escrow with embedded insurance for import and export deals — funds are held in USDC on Stellar, released per milestone on attested trade events, and underwritten by insurance partners. KYB attestations and deal records are anchored on-chain via Soroban contracts.
