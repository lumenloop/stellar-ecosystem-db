description: BLNT V3 is an independently developed, immutable lending protocol derived from Blend and deployed on Stellar. It supports permissionless lending markets, tiered backstops, BLNT emissions, and pools containing real-world and issuer-controlled assets. The V3-specific changes are awaiting independent security audits. BLNT V3 is not an official Blend release.
