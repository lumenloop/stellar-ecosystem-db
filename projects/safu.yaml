description: SAFU is a community-owned wallet protection pool being built on Stellar's Soroban. Members deposit XLM into a shared pool and receive automatic payouts if their wallet is drained — verified by a deterministic on-chain oracle with no committee or governance vote. Idle pool capital earns yield via DeFindex and Blend. A live, audited version already runs on Ethereum mainnet.
