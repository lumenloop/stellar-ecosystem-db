description: Chainless is a chain-abstracted, self-custody investment app live in Brazil. Users sign in with Google or Apple — no seed phrase — and get an MPC-secured wallet (via Web3Auth) to buy/sell crypto with Pix, earn dollar savings yield, hold assets across chains, and spend with a card. Gas is fully sponsored and there is no network selector; assets appear in one unified portfolio regardless of the underlying chain.
