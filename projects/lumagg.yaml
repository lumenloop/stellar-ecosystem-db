description: LumAgg is a liquidity aggregator for Stellar’s Soroban DEX ecosystem. It discovers prices across Soroswap, Aquarius (volatile, stable, and CLMM), Phoenix, Sushi V3, Comet, and Stellar Classic DEX, then returns the best route—including split execution across multiple venues in a single atomic swap.
